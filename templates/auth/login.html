{% extends "base.html" %}
{% block title %}Login — SewaDroneCilegonBanten{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-drone text-primary" style="font-size: 3rem;"></i>
                        <h4 class="fw-bold mt-2">Masuk</h4>
                        <p class="text-muted">Selamat datang kembali!</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label class="form-label">Username atau Email</label>
                            <input type="text" name="username" class="form-control" placeholder="Masukkan username/email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Masukkan password" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" name="remember" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">Ingat saya</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Masuk
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <small class="text-muted">Belum punya akun? <a href="{{ url_for('auth.register') }}" class="text-primary">Daftar</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
